name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v7

      - name: Установка Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Установка NSIS
        run: choco install nsis -y

      - name: Добавление NSIS в PATH
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Проверка NSIS
        run: makensis /VERSION

      - name: Запуск тестов
        run: go test ./internal/...

      - name: Подготовить публичный сертификат для инсталлятора
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_PASSWORD)) {
            Write-Warning "Секреты подписи не заданы; инсталлятор соберётся без codesign.cer"
            exit 0
          }
          $tmp = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64.Trim()))
          try {
            & (Join-Path $pwd "build/windows/sign-binaries.ps1") `
              -PfxPath $tmp `
              -Password $env:CODE_SIGN_PFX_PASSWORD `
              -ExportOnly
          } finally {
            if (Test-Path $tmp) { Remove-Item -LiteralPath $tmp -Force }
          }

      - name: Сборка frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Проверка frontend/dist
        shell: pwsh
        run: |
          if (-not (Test-Path frontend/dist/index.html)) {
            Write-Error "frontend/dist/index.html missing — UI not built"
            exit 1
          }

      - name: Сборка приложения
        run: wails build --nsis

      - name: Подпись exe
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_PASSWORD)) {
            Write-Warning "CODE_SIGN_PFX_BASE64 / CODE_SIGN_PFX_PASSWORD не заданы; подпись exe пропущена"
            exit 0
          }
          $tmp = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64.Trim()))
          try {
            $binDir = (Resolve-Path build/bin).Path
            & (Join-Path $pwd "build/windows/sign-binaries.ps1") `
              -PfxPath $tmp `
              -Password $env:CODE_SIGN_PFX_PASSWORD `
              -BinDir $binDir `
              -ExeOnly
          } finally {
            if (Test-Path $tmp) { Remove-Item -LiteralPath $tmp -Force }
          }

      - name: Сборка NSIS-инсталлятора
        shell: pwsh
        run: |
          $installerDir = Join-Path $pwd "build/windows/installer"
          $binary = (Resolve-Path "build/bin/presentation-timer.exe").Path
          Push-Location $installerDir
          try {
            makensis -DARG_WAILS_AMD64_BINARY="$binary" project.nsi
          } finally {
            Pop-Location
          }

      - name: Подпись installer
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_PASSWORD)) {
            Write-Warning "CODE_SIGN_PFX_BASE64 / CODE_SIGN_PFX_PASSWORD не заданы; подпись installer пропущена"
            exit 0
          }
          $tmp = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64.Trim()))
          try {
            $binDir = (Resolve-Path build/bin).Path
            & (Join-Path $pwd "build/windows/sign-binaries.ps1") `
              -PfxPath $tmp `
              -Password $env:CODE_SIGN_PFX_PASSWORD `
              -BinDir $binDir `
              -InstallerOnly
            if (Test-Path build/windows/codesign.cer) {
              Copy-Item -LiteralPath build/windows/codesign.cer -Destination (Join-Path $binDir "codesign.cer") -Force
            }
          } finally {
            if (Test-Path $tmp) { Remove-Item -LiteralPath $tmp -Force }
          }

      - name: Проверка артефактов сборки
        shell: pwsh
        run: |
          $exe = "build/bin/presentation-timer.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "presentation-timer.exe not found in build/bin"
            Get-ChildItem -Recurse build/bin -ErrorAction SilentlyContinue
            exit 1
          }
          $minBytes = 8MB
          $size = (Get-Item $exe).Length
          if ($size -lt $minBytes) {
            Write-Error "presentation-timer.exe is too small ($size bytes) — frontend may be missing"
            exit 1
          }
          if (-not (Test-Path build/bin/presentation-timer-*-installer.exe)) {
            Write-Error "NSIS installer was not built"
            exit 1
          }
          if (-not (Test-Path frontend/dist/index.html)) {
            Write-Error "frontend/dist/index.html missing after build"
            exit 1
          }
          Get-ChildItem build/bin

      - name: SHA256 для описания релиза
        shell: pwsh
        run: |
          $lines = @(
            "## Файлы",
            "",
            "- ``presentation-timer-*-installer.exe`` — основной способ установки: копирует приложение и сам импортирует публичный сертификат (нужны права администратора).",
            "- ``presentation-timer.exe`` — portable-сборка без установки сертификата.",
            "- ``codesign.cer`` — тот же публичный сертификат, если нужен ручной импорт для portable.",
            "",
            "## SHA256",
            ""
          )
          Get-ChildItem build/bin -File | Where-Object { $_.Extension -in ".exe", ".cer" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "- ``$($_.Name)``: ``$hash``"
          }
          $lines += ""
          $lines += "Скачивайте только с этой страницы GitHub Releases. Рекомендуется инсталлятор: он ставит программу и импортирует ``codesign.cer`` в TrustedPeople и TrustedPublisher. Самоподпись не заменяет сертификат центра сертификации; SmartScreen всё ещё может предупредить."
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::WriteAllText((Join-Path (Resolve-Path build/bin) "release-notes.md"), ($lines -join "`n") + "`n", $utf8)

      - name: Создание релиза и загрузка файлов
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/presentation-timer.exe
            build/bin/presentation-timer-*-installer.exe
            build/bin/codesign.cer
          body_path: build/bin/release-notes.md
          fail_on_unmatched_files: false
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
