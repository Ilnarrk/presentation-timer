name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v7

      - name: Установка Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Установка NSIS
        run: choco install nsis -y

      - name: Добавление NSIS в PATH
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Проверка NSIS
        run: makensis /VERSION

      - name: Запуск тестов
        run: go test ./internal/...

      - name: Сборка приложения
        run: wails build --nsis

      - name: Проверка артефактов сборки
        shell: pwsh
        run: |
          if (-not (Test-Path build/bin/presentation-timer.exe)) {
            Write-Error "presentation-timer.exe not found in build/bin"
            Get-ChildItem -Recurse build/bin -ErrorAction SilentlyContinue
            exit 1
          }
          Get-ChildItem build/bin
          if (-not (Test-Path build/bin/presentation-timer-*-installer.exe)) {
            Write-Warning "Installer was not built; release will contain only presentation-timer.exe"
          }

      - name: Создание релиза и загрузка файлов
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/presentation-timer.exe
            build/bin/presentation-timer-*-installer.exe
          fail_on_unmatched_files: false
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
